minimumReleaseAgeExcludePrune: true
minimumReleaseAgeExclude:
  - '@nuxt/cli@4.0.1'
  - '@nuxt/kit@4.6.1'
  - '@nuxt/nitro-server@4.6.1'
  - '@nuxt/schema@4.6.1'
  - '@nuxt/vite-builder@4.6.1'
  - '@nuxt/vite-server@4.6.1'
  - nuxt@4.6.1

trustPolicy: no-downgrade
trustPolicyExclude:
  - semver@6.3.1
  - 'cssnano*'
  - 'postcss-*'
  - stylehacks
  - css-declaration-sorter

shellEmulator: true

allowBuilds:
  '@parcel/watcher': true
  esbuild: true
  vue-demi: true
  workerd: true
